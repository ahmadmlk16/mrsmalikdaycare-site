<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Family photos | Mrs. Malik's Daycare</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css?v=20260928d">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="/"><img src="/assets/favicon.svg" alt="" width="32" height="32"> Mrs. Malik's Daycare</a>
    <div class="who">
      <a class="btn btn-sm" href="/holidays">Closed days</a>
      <a class="btn btn-sm" href="/documents">Forms</a>
      <button class="btn btn-sm" id="info-btn">My family info</button>
      <button class="btn btn-sm" id="pw-btn">Change password</button>
      <button class="btn btn-sm" id="logout">Log out</button>
    </div>
  </div>
</header>

<main class="portal" id="portal" hidden>
  <div class="portal-hero">
    <div>
      <p class="muted" style="margin:0 0 4px;font-weight:700">Welcome back</p>
      <h1 id="hello"></h1>
      <p class="muted" id="sub" style="margin:0"></p>
    </div>
  </div>
  <div class="msg" id="info-nudge" hidden style="background:#fff3e6;color:#8a4a17">
    Please add your phone number and an emergency contact so Mrs. Malik can reach someone quickly.
    <button class="btn btn-sm" id="nudge-btn" style="margin-left:8px">Add now</button>
  </div>
  <section class="card portal-docs" id="documents" hidden>
    <h2>My documents</h2>
    <p class="muted" style="margin:0">Signed forms, statements, and other papers Mrs. Malik has saved for your family.</p>
    <div id="doc-list"></div>
  </section>
  <h2 class="portal-section-title" id="photos-title" hidden>Photos</h2>
  <div class="portal-grid" id="grid"></div>
</main>

<script src="/assets/app.js?v=20260928d"></script>
<script>
(async () => {
  const { api, esc, modal, lightbox, logout, toast, familyProfileFields, formBody } = App;
  let user;
  try { ({ user } = await api('/api/session')); } catch {}
  if (!user || user.mustChangePassword) return (location.href = '/login');
  if (user.role === 'admin') return (location.href = '/admin');

  document.getElementById('portal').hidden = false;
  document.getElementById('logout').onclick = logout;
  document.getElementById('hello').textContent = user.name;

  const [{ photos }, { documents }] = await Promise.all([api('/api/family/photos'), api('/api/family/documents')]);
  if (documents.length) {
    const KIND = { pdf: 'PDF', doc: 'DOC', docx: 'DOC', rtf: 'DOC', xls: 'XLS', xlsx: 'XLS', csv: 'XLS', ppt: 'PPT', pptx: 'PPT', jpg: 'IMG', jpeg: 'IMG', png: 'IMG', heic: 'IMG', txt: 'TXT' };
    const size = (b) => (b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB');
    const groups = new Map();
    for (const d of documents) {
      const k = d.category || 'Other';
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(d);
    }
    document.getElementById('doc-list').innerHTML = [...groups]
      .map(([cat, docs]) => `<h3 class="portal-doc-group">${esc(cat)}</h3>${docs
        .map((d) => {
          const kind = KIND[d.ext] || 'FILE';
          const view = ['pdf', 'jpg', 'jpeg', 'png'].includes(d.ext);
          return `<div class="row-card closure-row portal-doc-row">
            <div style="display:flex;gap:12px;align-items:center;min-width:0">
              <span class="doc-badge doc-${kind.toLowerCase()}">${kind}</span>
              <div class="closure-when"><strong>${esc(d.title)}</strong>
                <span class="small muted">${esc(d.ext.toUpperCase())} · ${size(d.size)} · added ${App.fmtDate(d.createdAt)}</span>
                ${d.description ? `<span class="small">${esc(d.description)}</span>` : ''}</div>
            </div>
            <div class="actions">
              ${view ? `<a class="btn btn-sm" href="${esc(d.url)}" target="_blank" rel="noopener">View</a>` : ''}
              <a class="btn btn-sm btn-primary" href="${esc(d.url)}?download=1">Download</a>
            </div>
          </div>`;
        })
        .join('')}`)
      .join('');
    document.getElementById('documents').hidden = false;
    document.getElementById('photos-title').hidden = false;
    if (location.hash === '#documents') document.getElementById('documents').scrollIntoView();
  }
  const grid = document.getElementById('grid');
  document.getElementById('sub').textContent = photos.length
    ? `${photos.length} photo${photos.length === 1 ? '' : 's'} of ${user.children || 'your little one'}. Tap a photo to see it full size or download it.`
    : '';
  if (!photos.length) {
    grid.innerHTML = `<div class="card empty" style="grid-column:1/-1">No photos yet. Check back soon. Mrs. Malik adds new photos regularly!</div>`;
  }
  photos.forEach((p, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-label', p.caption || `Photo ${i + 1}`);
    b.innerHTML = `<img src="${esc(p.url)}" alt="${esc(p.caption)}" loading="lazy">`;
    b.onclick = () => lightbox(photos, i, { download: true });
    grid.appendChild(b);
  });

  const nudge = document.getElementById('info-nudge');
  const updateNudge = () => (nudge.hidden = !!(user.profile.phone && user.profile.emergencyName && user.profile.emergencyPhone));
  updateNudge();
  const openInfo = () =>
    modal(`<form><h2>My family info</h2>
      <p class="muted">Keep this up to date so Mrs. Malik can reach you or your emergency contact.</p>
      <p class="msg err" hidden></p>
      ${familyProfileFields(user.profile)}
      <div class="modal-actions"><button type="button" class="btn" data-close="">Cancel</button><button class="btn btn-primary" type="submit">Save</button></div></form>`, {
      onMount: (m, close) => {
        m.querySelector('input').focus();
        m.querySelector('form').onsubmit = async (e) => {
          e.preventDefault();
          try {
            ({ user } = await api('/api/account/profile', { method: 'PATCH', body: formBody(e.target) }));
            close();
            updateNudge();
            toast('Your info was saved');
          } catch (err) {
            const msg = m.querySelector('.msg');
            msg.textContent = err.message;
            msg.hidden = false;
          }
        };
      },
    });
  document.getElementById('info-btn').onclick = openInfo;
  document.getElementById('nudge-btn').onclick = openInfo;

  document.getElementById('pw-btn').onclick = () =>
    modal(`<form><h2>Change password</h2><p class="msg err" hidden></p>
      <label class="field"><span>Current password</span><input name="current" type="password" autocomplete="current-password" required></label>
      <label class="field"><span>New password <small>(at least 8 characters)</small></span><input name="next" type="password" autocomplete="new-password" minlength="8" required></label>
      <label class="field"><span>Confirm new password</span><input name="confirm" type="password" autocomplete="new-password" minlength="8" required></label>
      <div class="modal-actions"><button type="button" class="btn" data-close="">Cancel</button><button class="btn btn-primary" type="submit">Save</button></div></form>`, {
      onMount: (m, close) => {
        m.querySelector('input').focus();
        m.querySelector('form').onsubmit = async (e) => {
          e.preventDefault();
          const d = Object.fromEntries(new FormData(e.target));
          const msg = m.querySelector('.msg');
          try {
            if (d.next !== d.confirm) throw new Error("The new passwords don't match.");
            await api('/api/account/password', { method: 'POST', body: { current: d.current, next: d.next } });
            close();
            toast('Password updated');
          } catch (err) {
            msg.textContent = err.message;
            msg.hidden = false;
          }
        };
      },
    });
})();
</script>
</body>
</html>
